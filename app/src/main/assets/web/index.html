<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Games Lobby</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:700px;margin:0 auto;padding:16px;background:#f6f7fb}
    .card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .cell{aspect-ratio:1;font-size:40px;border:none;border-radius:10px;background:#eef2ff}
  </style>
</head>
<body>
  <div class="card">
    <h2>Lobby beitreten</h2>
    <input id="code" placeholder="Lobby-Code" />
    <button onclick="join()">Beitreten</button>
    <p id="status"></p>
  </div>
  <div class="card">
    <h3>Tic Tac Toe</h3>
    <p id="turn">Warte auf Start ...</p>
    <div id="board" class="grid"></div>
    <button onclick="resetGame()">Neues Spiel (Host)</button>
  </div>
<script>
const params = new URLSearchParams(location.search);
if(params.get('code')) document.getElementById('code').value = params.get('code');
let ws, lobbyCode='', symbol='X', state={cells:Array(9).fill(''),turn:'X',winner:''};
const board = document.getElementById('board');
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.onclick=()=>move(i);board.appendChild(b);} render();
function join(){
  lobbyCode=document.getElementById('code').value.trim().toUpperCase();
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen=()=>status('Verbunden');
  ws.onmessage=(e)=>{
    const m=JSON.parse(e.data);
    if(m.type==='state'){state=JSON.parse(m.payload);render();}
    if(m.type==='reset'){state={cells:Array(9).fill(''),turn:'X',winner:''};render();}
  }
}
function move(index){ if(!ws||state.winner||state.cells[index]) return;
  ws.send(JSON.stringify({type:'move',lobbyCode,index,symbol,isHost:false}));
}
function resetGame(){ if(!ws) return; ws.send(JSON.stringify({type:'reset',lobbyCode,isHost:true})); }
function render(){
  [...board.children].forEach((el,i)=>el.textContent=state.cells[i]);
  document.getElementById('turn').textContent = state.winner ? `Gewinner: ${state.winner}` : `Am Zug: ${state.turn}`;
}
function status(t){document.getElementById('status').textContent=t}
</script>
</body></html>
